<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating - unlockED</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0A0A0A;
      --accent: #38bdf8;
      --text: #F8FAFC;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease-out forwards;
    }

    .spinner {
      width: 64px;
      height: 64px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 32px;
    }

    .loading-text {
      font-family: 'Geist', sans-serif;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 2s linear infinite;
    }

    .sub-text {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #64748b;
      opacity: 0;
      animation: fadeInSub 0.5s ease-out 1s forwards;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shine { to { background-position: 200% center; } }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeInSub { to { opacity: 1; } }

    /* Page transition out */
    .fade-out {
      animation: fadeOut 0.5s ease-in forwards;
    }
    @keyframes fadeOut { to { opacity: 0; transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div class="loading-text" id="status">Establishing secure connection...</div>
    <div class="sub-text">Loading institutional workspace</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    const dest = role === 'counselor' ? '/dashboard' : '/student';
    const statusEl = document.getElementById('status');

    // Simulate a cool loading sequence
    const steps = [
      "Loading unlockED Engine...",
      "Syncing AI compliance models...",
      "Connecting to workspace..."
    ];

    let step = 0;
    const interval = setInterval(() => {
      if (step < steps.length) {
        statusEl.style.opacity = 0;
        setTimeout(() => {
          statusEl.innerText = steps[step++];
          statusEl.style.opacity = 1;
        }, 200);
      } else {
        clearInterval(interval);
        // Fade out and redirect
        document.getElementById('loader').classList.add('fade-out');
        setTimeout(() => {
          window.location.href = dest;
        }, 500);
      }
    }, 600); // changes text every 600ms, total ~2.5 seconds
  </script>
</body>
</html>
