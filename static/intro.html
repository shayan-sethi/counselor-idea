<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading - unlockED Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F7FE;
      --accent: #6366F1;
      --text-1: #111827;
      --text-2: #4B5563;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-out forwards;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    .loading-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 8px;
    }

    .sub-text {
      font-size: 0.9rem;
      color: var(--text-2);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Page transition out */
    .fade-out {
      animation: fadeOut 0.4s ease-in forwards;
    }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-10px); } }
  </style>
</head>
<body>
  <div class="loader-container" id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Preparing workspace</div>
    <div class="sub-text">Authenticating secure session...</div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const role = urlParams.get('role');
    const dest = role === 'counselor' ? '/dashboard' : '/student';

    // Simple, subtle wait without flashing text, then transition
    setTimeout(() => {
      document.getElementById('loader').classList.add('fade-out');
      setTimeout(() => {
        window.location.href = dest;
      }, 400); // Wait for fade out animation
    }, 1200); // Short simulated loading time
  </script>
</body>
</html>
