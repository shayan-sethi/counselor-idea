<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - unlockED Portal</title>
  <link rel="icon" type="image/png" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F7FE;
      --surface: #FFFFFF;
      --surface-alt: #FAFAFA;
      --border: #E2E8F0;
      --accent: #6366F1;
      --accent-hover: #4F46E5;
      --text-1: #111827;
      --text-2: #4B5563;
      --text-3: #9CA3AF;
      --error: #EF4444;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: linear-gradient(180deg, #E0E7FF 0%, #F4F7FE 400px, #F4F7FE 100%);
      color: var(--text-2);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px;
      box-shadow: var(--shadow-lg);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-prism {
      font-weight: 800;
      font-size: 2.2rem;
      color: var(--text-1);
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    
    .logo-prism span {
      color: var(--accent);
    }

    .logo-subtitle {
      font-size: 0.85rem;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 32px;
      background: var(--surface-alt);
      border-radius: 8px;
      padding: 4px;
      border: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      color: var(--text-2);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .auth-tab.active {
      color: var(--accent);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text-1);
      font-family: var(--font-sans);
      font-size: 1rem;
      transition: all 0.2s ease;
      outline: none;
    }
    
    input::placeholder {
      color: var(--text-3);
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 8px;
      box-shadow: var(--shadow-sm);
    }

    .btn-login:hover {
      background: var(--accent-hover);
    }
    
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-banner {
      background: #FEE2E2;
      border: 1px solid #FCA5A5;
      color: var(--error);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 24px;
      display: none;
    }

    .hint-area {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--text-2);
      line-height: 1.6;
    }

    .hint-area code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-1);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  
  <div class="login-container">
    <div class="logo-area">
      <img src="/static/logo.png" width="60" height="60" alt="unlockED Logo" style="margin-bottom:12px; display:inline-block;" />
      <div class="logo-prism">unlock<span>ED</span></div>
      <div class="logo-subtitle">Institutional Portal</div>
    </div>

    <div class="error-banner" id="error-box">Invalid credentials</div>



    <form onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. counselor or STU_001" required autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom: 28px;">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>


      <button type="submit" class="btn-login" id="btn-submit">Sign In</button>
    </form>

    <div class="hint-area">
      <strong>Demo Accounts:</strong><br>
      Admin: <code>admin</code> / <code>admin123</code><br>
      Counselor: <code>counselor</code> / <code>counselor123</code><br>
      Student: <code>STU_001</code> / <code>student123</code>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="/static/firebase-config.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const syntheticEmail = (username) => `${username}@unlocked.local`;


    function setMode(newMode) {
      mode = newMode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('confirm-group').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('btn-submit').textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
      document.getElementById('error-box').style.display = 'none';
      if (mode === 'signup') {
        document.getElementById('confirm-password').setAttribute('required', 'true');
      } else {
        document.getElementById('confirm-password').removeAttribute('required');
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-submit');
      
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (mode === 'signup') {
        const confirm = document.getElementById('confirm-password').value;
        if (password !== confirm) {
          errBox.textContent = "Passwords do not match";
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account';
          return;
        }
      }

      const resetButton = () => {
        btn.disabled = false;
        btn.textContent = mode === 'signup' ? 'Create Account' : 'Sign In';
      };
      const showError = (message) => {
        errBox.textContent = message;
        errBox.style.display = 'block';
        resetButton();
      };

      try {

        if (mode === 'signup') {
          let wizardData = null;
          const saved = localStorage.getItem('wizardData');
          if (saved) {
            try { wizardData = JSON.parse(saved); } catch (e) {}
          }

          const res = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, wizardData })
          });
          const data = await res.json();
          if (!res.ok) {
            showError(data.error || 'Signup failed');
            return;
          }
          localStorage.removeItem('wizardData');
        }

        // Sign-in establishes the actual Firebase session (for signup, the
        // account was just created server-side with these same credentials).
        await firebase.auth().signInWithEmailAndPassword(syntheticEmail(username), password);

        const idToken = await firebase.auth().currentUser.getIdToken();
        const sessionRes = await fetch('/api/user_session', {
          headers: { Authorization: `Bearer ${idToken}` }
        });
        const sessionData = await sessionRes.json();

        if (sessionData.role === 'admin') {
          window.location.href = '/static/admin.html';
        } else if (sessionData.role === 'counselor') {
          window.location.href = '/static/intro.html?role=counselor';
        } else {
          window.location.href = '/static/intro.html?role=student';
        }
      } catch (err) {
        showError(err.code === 'auth/invalid-credential' ? 'Invalid username or password' : err.message);
      }
    }
  </script>
</body>
</html>
