<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - unlockED Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d15;
      --surface: #0f1219;
      --border: rgba(225, 225, 205, 0.15);
      --accent: #E1E1CD;
      --accent-glow: rgba(225, 225, 205, 0.15);
      --text: #E1E1CD;
      --text-muted: rgba(225, 225, 205, 0.6);
      --error: #ef4444;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 80px var(--accent-glow);
      position: relative;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-prism {
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 8px;
    }

    .logo-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-login {
      width: 100%;
      background: var(--accent);
      color: #0a0d15;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px var(--accent-glow);
      margin-top: 10px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
      background: #ffffff;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .hint-area {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .hint-area code {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 4px;
      border-radius: 4px;
      color: #a5b4fc;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .auth-tab.active {
      color: var(--text);
      border-bottom: 2px solid var(--accent);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-area">
      <div class="logo-prism">unlockED</div>
      <div class="logo-subtitle">Institutional School & Counselor Portal</div>
    </div>

    <div class="error-banner" id="error-box">Invalid credentials</div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="setMode('login')">Sign In</div>
      <div class="auth-tab" id="tab-signup" onclick="setMode('signup')">Create Account</div>
    </div>

    <form onsubmit="handleAuth(event)">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. counselor or STU_001" required autocomplete="username">
      </div>
      <div class="form-group" style="margin-bottom: 28px;">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="form-group" id="confirm-group" style="margin-bottom: 28px; display: none;">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" placeholder="••••••••" autocomplete="new-password">
      </div>

      <button type="submit" class="btn-login" id="btn-submit">Sign In →</button>
    </form>

    <div class="hint-area">
      <strong>Demo Accounts:</strong><br>
      Counselor: <code>counselor</code> / <code>counselor123</code><br>
      Student: <code>STU_001</code> / <code>student123</code>
    </div>
  </div>

  <script>
    let mode = 'login';

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('tab-login').classList.toggle('active', mode === 'login');
      document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
      document.getElementById('confirm-group').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('btn-submit').textContent = mode === 'signup' ? 'Create Account →' : 'Sign In →';
      document.getElementById('error-box').style.display = 'none';
      if (mode === 'signup') {
        document.getElementById('confirm-password').setAttribute('required', 'true');
      } else {
        document.getElementById('confirm-password').removeAttribute('required');
      }
    }

    async function handleAuth(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-submit');
      
      errBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (mode === 'signup') {
        const confirm = document.getElementById('confirm-password').value;
        if (password !== confirm) {
          errBox.textContent = "Passwords do not match";
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Create Account →';
          return;
        }
      }

      let wizardData = null;
      if (mode === 'signup') {
        const saved = localStorage.getItem('wizardData');
        if (saved) {
          try { wizardData = JSON.parse(saved); } catch(e) {}
        }
      }

      const endpoint = mode === 'signup' ? '/api/signup' : '/api/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, wizardData })
        });
        const data = await res.json();
        
        if (!res.ok) {
          errBox.textContent = data.error || 'Authentication failed';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = mode === 'signup' ? 'Create Account →' : 'Sign In →';
        } else {
          if (mode === 'signup') localStorage.removeItem('wizardData');
          if (data.role === 'counselor') {
            window.location.href = '/static/intro.html?role=counselor';
          } else {
            window.location.href = '/static/intro.html?role=student';
          }
        }
      } catch (err) {
        errBox.textContent = err.message;
        errBox.style.display = 'block';
        btn.disabled = false;
        btn.textContent = mode === 'signup' ? 'Create Account →' : 'Sign In →';
      }
    }
  </script>
</body>
</html>
